appId: com.maildesk.app
productName: MailDesk
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# 托盘图标在运行时读取，不能进 asar
extraResources:
  - from: resources
    to: resources
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: MailDesk
  artifactName: ${productName}-${version}-setup.${ext}
